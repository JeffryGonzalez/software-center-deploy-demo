apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: catalog-db
  namespace: software-center
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: software-center
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      containers:
        - name: catalog-api
          image: jeffrygonzalez/sc-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_PATH
              value: /data/catalog.db
          volumeMounts:
            - name: db-storage
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: catalog-db

---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: software-center
spec:
  selector:
    app: catalog-api
  ports:
    - port: 3000
      targetPort: 3000
