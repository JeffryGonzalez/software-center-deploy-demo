services:
  api:
    build: ./api
    ports:
      - "3000:3000"
    volumes:
      - catalog-data:/data
    environment:
      PORT: "3000"
      DB_PATH: /data/catalog.db

  frontend:
    build: ./frontend
    environment:
      API_URL: http://api:3000

  bff:
    build: ./bff
    ports:
      - "1337:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ReverseProxy__Clusters__api__Destinations__primary__Address: http://api:3000
      ReverseProxy__Clusters__frontend__Destinations__primary__Address: http://frontend
    depends_on:
      - api
      - frontend

volumes:
  catalog-data:
