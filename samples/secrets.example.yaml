# EXAMPLE ONLY — DO NOT APPLY AS-IS, DO NOT COMMIT REAL VALUES
#
# In our environment these Secret objects are produced from HashiCorp Vault
# (via the Vault Secrets Operator / External Secrets), not hand-written YAML.
# This file is included purely as a reference so you can see which keys each
# Deployment expects under `secretKeyRef`. Values below are obviously fake.
#
# If you ever did create these by hand for a throwaway dev cluster:
#   kubectl create secret generic bff-secrets -n students \
#     --from-literal=OIDC__ClientSecret='...' ...
# ...is safer than committing literal values to git.
---
apiVersion: v1
kind: Secret
metadata:
  name: bff-secrets
  namespace: students
type: Opaque
stringData:
  ConnectionStrings__appdb: "FAKE-postgres-connection-string-REPLACE-ME"
  OIDC__ClientSecret: "FAKE-oidc-client-secret-REPLACE-ME"
  Keycloak__ServiceAccount__ClientSecret: "FAKE-service-account-secret-REPLACE-ME"
  Guacamole__AdminUsername: "FAKE-guac-admin-user"
  Guacamole__AdminPassword: "FAKE-guac-admin-password-REPLACE-ME"
  Guacamole__VmUsername: "FAKE-guac-vm-user"
  Guacamole__VmPassword: "FAKE-guac-vm-password-REPLACE-ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  namespace: students
type: Opaque
stringData:
  KC_DB_URL: "jdbc:postgresql://FAKE-host:5432/FAKE-db"
  KC_DB_USERNAME: "FAKE-db-user"
  KC_DB_PASSWORD: "FAKE-db-password-REPLACE-ME"
  KEYCLOAK_ADMIN: "FAKE-admin-user"
  KEYCLOAK_ADMIN_PASSWORD: "FAKE-admin-password-REPLACE-ME"
