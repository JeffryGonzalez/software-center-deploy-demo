# Astro Starlight frontend — static files served by nginx
# Build: ./scripts/build-and-push.sh --frontend-only
# See decisions/tdr-006-container-builds-and-versioning.md
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: students
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: jeffrygonzalez/ht-frontend:2026-05-07
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 51m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: students
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
